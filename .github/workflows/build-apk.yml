name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Generate Android scaffolding if missing
        run: |
          if [ ! -d android ]; then flutter create . --platforms=android --project-name pocketvault --org com.pocketvault; fi
      - name: Get Dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release --split-per-abi
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketVault-APK
          path: build/app/outputs/flutter-apk/*-release.apk
